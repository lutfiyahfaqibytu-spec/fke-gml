<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emailnator Clone - Pro Version</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 mt-10">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                Emailnator Pro
            </h1>
            <button onclick="generateEmail()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg transition duration-200 text-sm shadow-md">
                Generate Email Baru
            </button>
        </div>

        <!-- Kotak Alamat Email -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Alamat Email Anda</label>
            <div class="flex gap-2">
                <input type="text" id="emailBox" readonly value="Klik 'Generate Email Baru' untuk mulai..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-blue-400 font-mono text-sm focus:outline-none">
                <button onclick="copyEmail()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-3 rounded-lg text-sm transition duration-200 border border-gray-700">
                    Salin
                </button>
            </div>
        </div>

        <!-- Kotak Inbox -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Kotak Masuk (Inbox)</span>
                <span class="text-xs text-gray-500 animate-pulse">● Memantau pesan secara otomatis</span>
            </div>
            
            <div id="messageList" class="bg-gray-950 border border-gray-800 rounded-lg p-4 min-h-[250px] max-h-[400px] overflow-y-auto space-y-3">
                <div class="text-gray-500 text-center py-12 text-sm">
                    Belum ada email aktif. Silakan generate email terlebih dahulu.
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="text-xs text-gray-600 py-4">
        Powered by Vercel & Gmailnator API
    </footer>

    <!-- JavaScript Logika Frontend -->
    <script>
        let pollingInterval = null;
        let currentEmail = "";

        // Fungsi membuat email baru
        async function generateEmail() {
            document.getElementById("emailBox").value = "Memuat email baru...";
            document.getElementById("messageList").innerHTML = `<div class="text-gray-500 text-center py-12 text-sm">Menunggu email baru...</div>`;
            if (pollingInterval) clearInterval(pollingInterval);

            try {
                const res = await fetch('/api/generate');
                const data = await res.json();
                
                if (!res.ok) {
                    document.getElementById("emailBox").value = "Error: " + (data.error || "Gagal mengambil data");
                    return;
                }

                currentEmail = data.email || data.result || data.address || "";
                
                if (!currentEmail) {
                    document.getElementById("emailBox").value = "Format data kosong dari server";
                    return;
                }

                document.getElementById("emailBox").value = currentEmail;
                
                // Mulai polling inbox setelah email didapatkan
                startPolling();
                
            } catch (err) {
                document.getElementById("emailBox").value = "Gagal terhubung ke server!";
                console.error(err);
            }
        }

        // Fungsi Salin Email ke Clipboard
        function copyEmail() {
            const emailBox = document.getElementById("emailBox");
            if (!currentEmail) return;
            navigator.clipboard.writeText(currentEmail);
            alert("Email berhasil disalin: " + currentEmail);
        }

        // Mulai memantau inbox secara otomatis setiap 5 detik
        function startPolling() {
            if (!currentEmail) return;
            fetchInbox();

            pollingInterval = setInterval(() => {
                fetchInbox();
            }, 5000);
        }

        // Mengambil pesan masuk dari backend
        async function fetchInbox() {
            if (!currentEmail) return;

            try {
                const res = await fetch(`/api/messages?email=${encodeURIComponent(currentEmail)}`, {
                    method: "POST"
                });
                const data = await res.json();

                const messageList = document.getElementById("messageList");
                const messages = Array.isArray(data) ? data : (data.messages || data.result || []);

                if (messages.length === 0) {
                    messageList.innerHTML = `<div class="text-gray-500 text-center py-12 text-sm">Belum ada pesan masuk... Menunggu pesan baru</div>`;
                    return;
                }

                // Render daftar pesan ke layar
                messageList.innerHTML = messages.map(msg => `
                    <div class="bg-gray-900 p-4 rounded-lg border border-gray-800 hover:border-gray-700 transition duration-200">
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span>Dari: <strong class="text-gray-300">${msg.from || msg.sender || 'Tidak dikenal'}</strong></span>
                            <span>${msg.time || msg.date || ''}</span>
                        </div>
                        <div class="font-semibold text-white text-sm mb-1">${msg.subject || 'Tanpa Subjek'}</div>
                        <div class="text-gray-300 text-xs">${msg.snippet || msg.content || 'Isi pesan...'}</div>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Gagal mengambil inbox:", err);
            }
        }
    </script>
</body>
</html>
